name: Update Series

on:
  schedule:
    - cron: '0 * * * *'      # toutes les heures (s'arrête vite si rien n'a changé)
    - cron: '30 4 * * *'     # 1x/jour : run complet forcé + métadonnées rafraîchies
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorer l'empreinte et tout recalculer"
        type: boolean
        default: false

concurrency:
  group: update-series
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update series
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.schedule }}" = "30 4 * * *" ] || [ "${{ inputs.force }}" = "true" ]; then
            ARGS="--force --refresh-metadata"
          fi
          python scripts/update_series.py $ARGS

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A series/ scripts/.cache/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update series — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push